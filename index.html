<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه دنیای ماینکرافت</title>
    <link rel="stylesheet" href="style.css"> <!-- برای ظاهر بهتر، فایل style.css را جداگانه ایجاد کنید -->
    <style>
        /* استایل‌های اولیه برای نمایش بهتر (می‌توانید به style.css منتقل کنید) */
        body { font-family: 'Tahoma', sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background-color: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s ease; }
        .product-card:hover { transform: translateY(-5px); }
        .product-card h3 { margin-top: 0; color: #007bff; font-size: 1.2em; }
        .product-card p { color: #555; font-size: 0.95em; }
        .product-card button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 10px; transition: background-color 0.3s ease; }
        .product-card button:hover { background-color: #218838; }
        .loading-message, .error-message, .no-items-message { text-align: center; padding: 20px; color: #777; }
        .error-message { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>فروشگاه دنیای ماینکرافت</h1>

        <!-- بخش رنک‌ها -->
        <div class="section">
            <h2>رنک‌ها</h2>
            <div id="ranks-list" class="items-grid">
                <div class="loading-message">در حال بارگذاری رنک‌ها...</div>
            </div>
        </div>

        <!-- بخش آیتم‌های کلیدی -->
        <div class="section">
            <h2>آیتم‌های کلیدی</h2>
            <div id="items-list" class="items-grid">
                <div class="loading-message">در حال بارگذاری آیتم‌ها...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Initialize Firebase -->
    <script>
        // پیکربندی Firebase خود را اینجا وارد کنید
        var firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL", // این مهمترین بخش است
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>

    <!-- اسکریپت اصلی -->
    <script src="script.js"></script>
</body>
</html>
