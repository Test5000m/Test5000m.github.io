<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه رنک و آیتم</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>فروشگاه</h1>

        <div class="product-section">
            <h2>انتخاب رنک</h2>
            <div id="ranks-list">
                <!-- Ranks will be loaded here by JavaScript -->
                <p>در حال بارگذاری رنک‌ها...</p>
            </div>
        </div>

        <div class="product-section">
            <h2>انتخاب آیتم</h2>
            <div id="items-list">
                <!-- Items will be loaded here by JavaScript -->
                <p>در حال بارگذاری آیتم‌ها...</p>
            </div>
        </div>

        <div class="cart-section">
            <h2>سبد خرید</h2>
            <ul id="cart-items">
                <!-- Cart items will be displayed here -->
                <li>سبد خرید شما خالی است.</li>
            </ul>
            <p>مبلغ کل: <span id="total-price">0</span> تومان</p>
            <button id="checkout-button" disabled>پرداخت</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
